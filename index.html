<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vertIDE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        #editor { height: 384px; min-height: 0; overflow: hidden; }
        #editor .cm-editor { height: 100%; }
        #editor .cm-scroller { overflow: auto; }
        #console { min-height: 160px; }
        #consoleOutput { white-space: pre-wrap; overflow-wrap: anywhere; }
        #consoleInput { outline: none; }
    </style>
</head>
<body class="bg-zinc-950 text-white min-h-screen">
    <header class="h-14 flex items-center px-6 border-b border-zinc-800">
        <h1 class="font-bold tracking-widest">VertIDE</h1>
        <div class="ml-auto flex gap-2">
            <button id="runButton" class="px-4 py-2 bg-zinc-800 rounded hover:bg-zinc-700">▶ Run</button>
            <button id="clrButton" class="px-4 py-2 bg-zinc-800 rounded hover:bg-zinc-700">Clear</button>
        </div>
    </header>

    <main class="p-6">
        <h2 class="text-zinc-400 mb-3">Editor</h2>

        <div class="flex gap-2 mb-3">
            <button class="file-tab px-3 py-2 bg-zinc-800 rounded" data-file="index.html">index.html</button>
            <button class="file-tab px-3 py-2 bg-zinc-800 rounded" data-file="style.css">style.css</button>
            <button class="file-tab px-3 py-2 bg-zinc-800 rounded" data-file="script.js">script.js</button>
        </div>

        <div class="flex gap-4 w-full">
            <div class="w-1/2" id="editor"></div>
            <div class="w-1/2">
                <iframe id="preview" class="w-full h-96 bg-white rounded"></iframe>
            </div>
        </div>

        <h2 class="text-zinc-400 mt-6 mb-3 bg-zinc-700/30 rounded p-1">Console</h2>
        <div id="console" class="bg-black border border-zinc-800 rounded overflow-hidden">
            <div id="consoleOutput" class="p-3 font-mono text-sm min-h-[120px]"></div>
            <div class="flex items-center border-t border-zinc-800 px-3 py-2 font-mono text-sm">
                <span class="text-zinc-500 mr-2">&gt;</span>
                <input
                    id="consoleInput"
                    class="flex-1 bg-transparent text-white"
                    placeholder="Type input here and press Enter..."
                    autocomplete="off"
                >
            </div>
        </div>
        <p class="text-xs text-zinc-600 mt-2">
            Press Enter in the console input to send a value to the running preview.
        </p>
    </main>

    <script type="importmap">
    {
        "imports": {
            "codemirror": "https://esm.sh/codemirror",
            "@codemirror/lang-html": "https://esm.sh/@codemirror/lang-html"
        }
    }
    </script>
    <script type="module" src="script.js"></script>
</body>
</html>
