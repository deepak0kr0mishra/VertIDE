<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>vertIDE</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>


<body class="bg-zinc-950 text-white">

    <header class="h-14 flex items-center px-6 border-b border-zinc-800">

        <h1 class="font-bold tracking-widest">
            VertIDE
        </h1>

        <button id="runButton" class="ml-auto px-4 py-2 bg-zinc-800 rounded hover:bg-zinc-700">
            ▶ Run
        </button>
        <button id="clrButton" class="ml-auto px-4 py-2 bg-zinc-800 rounded hover:bg-zinc-700">
            Clear
        </button>

    </header>


    <main class="p-6">

        <h2 class="text-zinc-400 mb-3">
            Editor
        </h2>
        <div class="">
            <button class="file-tab px-3 py-2 bg-zinc-800 rounded" data-file="index.html">index.html</button>
            <button class="file-tab px-3 py-2 bg-zinc-800 rounded" data-file="style.css">style.css</button>
            <button class="file-tab px-3 py-2 bg-zinc-800 rounded" data-file="script.js">script.js</button>
        </div>
        <div id="editor"></div>
        <iframe id="preview" class="w-full h-96 bg-white rounded"></iframe>

        <h2 class="text-zinc-400 mt-6 mb-3 bg-zinc-700/30 rounded  p-1">Console</h2>
        <div id="console" class="bg-black border border-zinc-800 rounded h-40 overflow-auto p-2"></div>
    </main>

    <script type="importmap">{
    "imports": {
        "codemirror": "https://esm.sh/codemirror",
        "@codemirror/lang-html": "https://esm.sh/@codemirror/lang-html"
        }
    }
    </script>
    <script type="module" src="script.js"></script>

</body>

</html>
